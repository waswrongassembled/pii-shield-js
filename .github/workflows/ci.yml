name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The Postgres stores, the conformance suite and the service on a real database (skipped elsewhere).
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pii_shield
          POSTGRES_PASSWORD: ci-only-secret # not a substring of table names: the service masks the password in messages
          POSTGRES_DB: pii_shield_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pii_shield -d pii_shield_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      PII_TEST_DATABASE_URL: postgres://pii_shield:ci-only-secret@127.0.0.1:5432/pii_shield_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run test/postgres.test.ts test/conformance.test.ts test/server-postgres.test.ts

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:package
      - run: npm run test:package
